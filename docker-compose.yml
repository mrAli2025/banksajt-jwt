services:
  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_FEATURE_NEW_DASHBOARD: "true"
        NEXT_PUBLIC_API_URL: ""
        # NEXT_PUBLIC_API_URL: "http://localhost:3001"
    ports:
      - "3000:3000"

  express:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bank_app
      DB_PASSWORD: bank_password
      DB_NAME: bank
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank_app
      MYSQL_PASSWORD: bank_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data: